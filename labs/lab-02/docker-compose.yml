# MongoDB для поискового робота:  make db-up / make db-down
services:
  mongo:
    image: mongo:7
    container_name: mai-ir-mongo
    ports:
      - "127.0.0.1:27017:27017"      # только локально, без авторизации
    volumes:
      - mongo-data:/data/db          # база переживает пересоздание контейнера
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 12

volumes:
  mongo-data:
